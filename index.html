// ============================================================
function App(){
  const[selectedMajor,setSelectedMajor]=useState(null);
  const[completed,setCompleted]=useState(new Set());
  const[current,setCurrent]=useState(new Set());
  const[hovered,setHovered]=useState(null);
  const[filter,setFilter]=useState("all");
  const[showElectives,setShowElectives]=useState(true);
  const[showGenElec,setShowGenElec]=useState(false);

  const major = selectedMajor ? MAJORS[selectedMajor] : null;
  const courses = major ? major.courses : {};

  const toggle=(code)=>{
    if(!courses[code])return;
    const isDone=completed.has(code);
    const isCur=current.has(code);
    if(isDone){setCompleted(p=>{const n=new Set(p);n.delete(code);return n});setCurrent(p=>{const n=new Set(p);n.delete(code);return n})}
    else if(isCur){setCurrent(p=>{const n=new Set(p);n.delete(code);return n});setCompleted(p=>new Set(p).add(code))}
    else{const c=courses[code];const ok=c.pre.every(p=>completed.has(p)||p==="APPROVAL"||p.includes("CH"));if(ok)setCurrent(p=>new Set(p).add(code))}
  };

  const available=useMemo(()=>{
    const s=new Set();
    Object.entries(courses).forEach(([code,c])=>{
      if(completed.has(code)||current.has(code))return;
      if(c.pre.every(p=>completed.has(p)||p==="APPROVAL"||p.includes("CH")))s.add(code);
    });return s;
  },[completed,current,courses]);

  const completedCH=useMemo(()=>{let t=0;completed.forEach(c=>{if(courses[c])t+=courses[c].ch});return t},[completed,courses]);
  const currentCH=useMemo(()=>{let t=0;current.forEach(c=>{if(courses[c])t+=courses[c].ch});return t},[current,courses]);

  const grouped=useMemo(()=>{
    const cats={gen:[],college:[],"college-cs":[],program:[],elective:[],"gen-elec":[]};
    Object.entries(courses).forEach(([code,c])=>{
      if(filter!=="all"){
        if(filter==="program"&&c.cat!=="program"&&c.cat!=="elective")return;
        if(filter==="college-all"&&c.cat!=="college"&&c.cat!=="college-cs")return;
        if(filter==="gen"&&c.cat!=="gen"&&c.cat!=="gen-elec")return;
        if(filter!=="program"&&filter!=="college-all"&&filter!=="gen"&&c.cat!==filter)return;
      }
      if(!showElectives&&c.cat==="elective")return;
      if(!showGenElec&&c.cat==="gen-elec")return;
      if(cats[c.cat])cats[c.cat].push(code);
    });
    return cats;
  },[courses,filter,showElectives,showGenElec]);

  const totalCH = major ? major.totalCH : 0;
  const critPath = major ? major.criticalPath : [];

  // Major selection screen
  if(!selectedMajor){
    return(
      <div style={{minHeight:"100vh",background:"#06070b",padding:"40px 24px"}}>
        <div style={{maxWidth:900,margin:"0 auto"}}>
          <div style={{textAlign:"center",marginBottom:48}}>
            <div style={{fontSize:11,letterSpacing:4,color:"#64748b",textTransform:"uppercase",marginBottom:12,fontFamily:"'DM Mono',monospace"}}>Abdullah Al Salem University</div>
            <h1 style={{fontSize:36,fontWeight:900,background:"linear-gradient(135deg,#f8fafc,#64748b)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",marginBottom:8}}>Course Prerequisite Map</h1>
            <p style={{color:"#475569",fontSize:14,lineHeight:1.6}}>Select your major to view the full course map with prerequisites, progress tracking, and critical path analysis.</p>
            <p style={{color:"#334155",fontSize:11,marginTop:8,fontFamily:"'DM Mono',monospace"}}>By Abdulrahman Alamry — Based on Official 2023-2024 / 2024-2025 Major Sheets</p>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(260,1fr))",gap:16}}>
            {Object.entries(MAJORS).map(([key,m])=>(
              <div key={key} onClick={()=>{setSelectedMajor(key);setCompleted(new Set());setCurrent(new Set())}}
                style={{background:"#0d0f14",border:`1.5px solid #1e293b`,borderRadius:12,padding:"20px 24px",cursor:"pointer",transition:"all 0.3s",position:"relative",overflow:"hidden"}}
                onMouseEnter={e=>{e.currentTarget.style.borderColor=m.color;e.currentTarget.style.transform="translateY(-3px)";e.currentTarget.style.boxShadow=`0 8px 32px ${m.color}22`}}
                onMouseLeave={e=>{e.currentTarget.style.borderColor="#1e293b";e.currentTarget.style.transform="none";e.currentTarget.style.boxShadow="none"}}>
                <div style={{position:"absolute",top:0,left:0,right:0,height:3,background:m.color,opacity:0.6}}/>
                <div style={{fontSize:12,fontWeight:800,color:m.color,letterSpacing:1,fontFamily:"'DM Mono',monospace",marginBottom:6}}>{m.abbr}</div>
                <div style={{fontSize:16,fontWeight:700,color:"#e2e8f0",marginBottom:8,lineHeight:1.3}}>{m.name}</div>
                <div style={{fontSize:11,color:"#64748b",fontFamily:"'DM Mono',monospace"}}>{m.totalCH} Credit Hours • {Object.keys(m.courses).length} Courses</div>
              </div>
            ))}
          </div>
          <div style={{textAlign:"center",marginTop:40,fontSize:10,color:"#1e293b",fontFamily:"'DM Mono',monospace"}}>Not an official university resource • Data sourced from official major sheet PDFs</div>
        </div>
      </div>
    );
  }

  const catLabel={gen:"General Education",college:"College Requirements (Math & Science)","college-cs":"College Requirements (Computing)","gen-elec":"General Education Electives",program:`${major.abbr} Program Requirements`,elective:`${major.abbr} Program Electives`};

  return(
    <div style={{minHeight:"100vh",background:"#06070b",fontFamily:"'DM Sans',sans-serif"}}>
      {/* Header */}
      <div style={{background:"linear-gradient(180deg,#0c0e14,#06070b)",borderBottom:"1px solid #1e293b",padding:"20px 24px"}}>
        <div style={{maxWidth:1200,margin:"0 auto"}}>
          <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:8}}>
            <button onClick={()=>setSelectedMajor(null)} style={{background:"none",border:"1px solid #1e293b",borderRadius:6,padding:"4px 10px",color:"#64748b",cursor:"pointer",fontSize:11,fontFamily:"inherit"}}>← Majors</button>
            <div style={{width:10,height:10,borderRadius:"50%",background:major.color,boxShadow:`0 0 12px ${major.color}66`}}/>
            <span style={{fontSize:11,color:"#64748b",letterSpacing:2,textTransform:"uppercase",fontFamily:"'DM Mono',monospace"}}>Abdullah Al Salem University</span>
          </div>
          <h1 style={{fontSize:24,fontWeight:900,color:"#f8fafc",margin:"4px 0"}}>{major.name}</h1>
          <p style={{color:"#475569",fontSize:11,fontFamily:"'DM Mono',monospace"}}>{major.totalCH} CH • Click courses to track progress • By Abdulrahman Alamry</p>
        </div>
      </div>

      {/* Stats */}
      <div style={{maxWidth:1200,margin:"12px auto 0",padding:"0 24px"}}>
        <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
          <div style={{flex:"1 1 180px",background:"#0d0f14",border:"1px solid #1e293b",borderRadius:10,padding:"12px 16px"}}>
            <div style={{fontSize:9,color:"#64748b",letterSpacing:2,textTransform:"uppercase",marginBottom:4,fontFamily:"'DM Mono',monospace"}}>Progress</div>
            <div><span style={{fontSize:24,fontWeight:900,color:"#22c55e"}}>{completedCH}</span><span style={{color:"#475569",fontSize:12}}> / {totalCH} CH</span></div>
            <div style={{height:3,background:"#1e293b",borderRadius:2,marginTop:6,overflow:"hidden"}}><div style={{height:"100%",width:`${(completedCH/totalCH)*100}%`,background:`linear-gradient(90deg,${major.color},${major.color}88)`,borderRadius:2,transition:"width 0.4s"}}/></div>
          </div>
          <div style={{flex:"1 1 140px",background:"#0d0f14",border:"1px solid #1e293b",borderRadius:10,padding:"12px 16px"}}>
            <div style={{fontSize:9,color:"#64748b",letterSpacing:2,textTransform:"uppercase",marginBottom:4,fontFamily:"'DM Mono',monospace"}}>Taking Now</div>
            <div><span style={{fontSize:24,fontWeight:900,color:"#3b82f6"}}>{current.size}</span><span style={{color:"#475569",fontSize:12}}> ({currentCH} CH)</span></div>
          </div>
          <div style={{flex:"1 1 280px",background:"#0d0f14",border:"1px solid #1e293b",borderRadius:10,padding:"12px 16px"}}>
            <div style={{fontSize:9,color:"#64748b",letterSpacing:2,textTransform:"uppercase",marginBottom:4,fontFamily:"'DM Mono',monospace"}}>Critical Path → First {major.abbr} Course</div>
            <div style={{display:"flex",gap:3,marginTop:4}}>{critPath.map(c=><div key={c} style={{flex:1,height:6,borderRadius:3,background:completed.has(c)?'#22c55e':current.has(c)?'#3b82f6':'#1e293b',transition:"background 0.3s"}} title={c}/>)}</div>
            <div style={{fontSize:9,color:"#64748b",marginTop:4,fontFamily:"'DM Mono',monospace"}}>{critPath.map((c,i)=><span key={c}><span style={{color:completed.has(c)?"#22c55e":current.has(c)?"#3b82f6":"#475569",fontWeight:completed.has(c)||current.has(c)?700:400}}>{c}</span>{i<critPath.length-1&&<span style={{color:"#334155"}}> → </span>}</span>)}</div>
          </div>
        </div>
      </div>

      {/* Filters */}
      <div style={{maxWidth:1200,margin:"10px auto 0",padding:"0 24px",display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}}>
        <span style={{fontSize:9,color:"#475569",letterSpacing:2,textTransform:"uppercase",fontFamily:"'DM Mono',monospace"}}>Show:</span>
        {[{k:"all",l:"All"},{k:"gen",l:"Gen Ed"},{k:"college-all",l:"College"},{k:"program",l:major.abbr+" Core + Electives"}].map(f=>
          <button key={f.k} onClick={()=>setFilter(f.k)} style={{padding:"4px 10px",borderRadius:5,fontSize:10,fontWeight:600,border:filter===f.k?`1px solid ${major.color}`:"1px solid #1e293b",background:filter===f.k?"#1e293b":"transparent",color:filter===f.k?"#e2e8f0":"#64748b",cursor:"pointer",fontFamily:"inherit"}}>{f.l}</button>
        )}
        <div style={{flex:1}}/>
        <button onClick={()=>setShowGenElec(!showGenElec)} style={{padding:"4px 10px",borderRadius:5,fontSize:10,fontWeight:600,border:showGenElec?"1px solid #475569":"1px solid #1e293b",background:showGenElec?"#1e293b":"transparent",color:showGenElec?"#e2e8f0":"#64748b",cursor:"pointer",fontFamily:"inherit"}}>{showGenElec?"▼":"▶"} Gen Electives</button>
        <button onClick={()=>{setCompleted(new Set());setCurrent(new Set())}} style={{padding:"4px 10px",borderRadius:5,fontSize:10,fontWeight:600,border:"1px solid #1e293b",background:"transparent",color:"#ef4444",cursor:"pointer",fontFamily:"inherit"}}>Reset</button>
      </div>

      {/* Legend */}
      <div style={{maxWidth:1200,margin:"8px auto 0",padding:"0 24px",display:"flex",gap:14,flexWrap:"wrap"}}>
        {[{c:"#22c55e",l:"Completed"},{c:"#3b82f6",l:"Taking"},{c:"#fbbf24",l:"Available"},{c:"#475569",l:"Locked"}].map(x=>
          <div key={x.l} style={{display:"flex",alignItems:"center",gap:5}}><div style={{width:8,height:8,borderRadius:2,background:x.c}}/><span style={{fontSize:9,color:"#64748b",fontFamily:"'DM Mono',monospace"}}>{x.l}</span></div>
        )}
      </div>

      {/* Course Grid by Category */}
      <div style={{maxWidth:1200,margin:"14px auto 40px",padding:"0 24px"}}>
        {["gen","gen-elec","college","college-cs","program","elective"].map(cat=>{
          const codes=grouped[cat];
          if(!codes||codes.length===0)return null;
          const catC=CAT_COLORS[cat]||CAT_COLORS.gen;
          return(
            <div key={cat} style={{marginBottom:14}}>
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:6}}>
                <div style={{fontSize:9,color:catC.text,letterSpacing:2,textTransform:"uppercase",background:catC.bg,padding:"3px 10px",borderRadius:4,border:`1px solid ${catC.border}33`,whiteSpace:"nowrap",fontFamily:"'DM Mono',monospace"}}>{catLabel[cat]||cat}</div>
                <div style={{flex:1,height:1,background:"#1e293b"}}/>
                <span style={{fontSize:9,color:"#334155",fontFamily:"'DM Mono',monospace"}}>{codes.length} courses</span>
              </div>
              <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                {codes.sort().map(code=>{
                  const course=courses[code];
                  const isDone=completed.has(code),isCur=current.has(code),isAvail=available.has(code);
                  const isCP=critPath.includes(code);
                  const isH=hovered===code;
                  let bc="#1e293b",bg="#0a0b10",op=0.4;
                  if(isDone){bc="#22c55e";bg="#0a150a";op=1}
                  else if(isCur){bc="#3b82f6";bg="#0a0e1a";op=1}
                  else if(isAvail){bc="#fbbf24";bg="#15140a";op=1}
                  if(isCP&&!isDone){bc=isCur?"#3b82f6":isAvail?"#f97316":"#ef4444"}
                  return(
                    <div key={code} onMouseEnter={()=>setHovered(code)} onMouseLeave={()=>setHovered(null)} onClick={()=>toggle(code)}
                      style={{position:"relative",width:168,minHeight:62,background:bg,border:`1.5px solid ${bc}`,borderRadius:7,padding:"8px 10px",cursor:"pointer",opacity:op,transition:"all 0.2s",transform:isH?"translateY(-2px)":"none",boxShadow:isH?`0 4px 16px ${bc}33`:"none"}}>
                      <div style={{position:"absolute",top:0,left:0,right:0,height:2,background:catC.border,borderRadius:"7px 7px 0 0",opacity:.4}}/>
                      {(isDone||isCur)&&<div style={{position:"absolute",top:6,right:6,width:7,height:7,borderRadius:"50%",background:isDone?"#22c55e":"#3b82f6",boxShadow:`0 0 6px ${isDone?"#22c55e":"#3b82f6"}66`}}/>}
                      <div style={{fontSize:10,fontWeight:800,color:catC.text,letterSpacing:.3,marginBottom:1,fontFamily:"'DM Mono',monospace"}}>{code}<span style={{fontWeight:400,color:"#475569",marginLeft:5,fontSize:8}}>{course.ch}CH</span></div>
                      <div style={{fontSize:9,color:isDone?"#86efac":isCur?"#93c5fd":"#94a3b8",fontWeight:600,lineHeight:1.3}}>{course.name}</div>
                      {isH&&<div style={{fontSize:8,color:"#64748b",lineHeight:1.5,marginTop:3,borderTop:"1px solid #1e293b",paddingTop:3,fontFamily:"'DM Mono',monospace"}}>
                        {course.pre.length>0&&!course.pre.every(p=>p==="APPROVAL"||p.includes("CH"))&&<div>Pre: {course.pre.filter(p=>p!=="APPROVAL"&&!p.includes("CH")).join(", ")}</div>}
                        {course.pre.some(p=>p.includes("CH"))&&<div>Req: Pass {course.pre.find(p=>p.includes("CH"))}</div>}
                        {course.coreq&&<div>Co-req: {course.coreq}</div>}
                      </div>}
                      {isCP&&!isDone&&<div style={{position:"absolute",bottom:3,right:5,fontSize:7,color:"#ef4444",fontWeight:700,letterSpacing:1,fontFamily:"'DM Mono',monospace"}}>CRITICAL</div>}
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>

      {/* How to use */}
      <div style={{maxWidth:1200,margin:"0 auto",padding:"0 24px 16px"}}>
        <div style={{background:"#0d0f14",border:"1px solid #1e293b",borderRadius:8,padding:"12px 16px",fontSize:10,color:"#64748b",lineHeight:1.8,fontFamily:"'DM Mono',monospace"}}>
          <b style={{color:"#94a3b8"}}>How to use:</b> Click <span style={{color:"#fbbf24"}}>available (yellow)</span> → taking. Click <span style={{color:"#3b82f6"}}>taking (blue)</span> → completed. Click <span style={{color:"#22c55e"}}>completed (green)</span> → undo. Hover for prerequisites.
        </div>
      </div>

      {/* Footer */}
      <div style={{borderTop:"1px solid #1e293b",padding:"14px 24px",textAlign:"center"}}>
        <div style={{fontSize:9,color:"#1e293b",lineHeight:1.8,fontFamily:"'DM Mono',monospace"}}>Made by Abdulrahman Alamry — SWE Student at AASU • Based on official 2023-2024 / 2024-2025 Major Sheets • Not an official university resource</div>
      </div>
    </div>
  );
}
ReactDOM.render(<App/>,document.getElementById("root"));
</script>
</body>
</html>
