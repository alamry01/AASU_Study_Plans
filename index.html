function build(k){const m=M[k];if(!m)return {};return{...GEN_ED,...m.gm,...m.c,...m.p,...m.e}}
const CC={gen:{b:"#64748b",t:"#94a3b8"},"gen-elec":{b:"#475569",t:"#64748b"},college:{b:"#22c55e",t:"#86efac"},"college-cs":{b:"#a855f7",t:"#d8b4fe"},program:{b:"#ef4444",t:"#fca5a5"},elective:{b:"#f59e0b",t:"#fcd34d"}};
const CL=(a)=>({gen:"General Education","gen-elec":"Gen Ed Electives",college:"College Requirements","college-cs":"College (Computing)",program:`${a} Core`,elective:`${a} Electives`});

function App(){
  const[sel,setSel]=useState(null);const[done,setDone]=useState(new Set());const[cur,setCur]=useState(new Set());const[hov,setHov]=useState(null);const[filt,setFilt]=useState("all");const[sge,setSge]=useState(false);const[name,setName]=useState("");const[yr,setYr]=useState(1);const[sem,setSem]=useState("fall");
  const m=sel?M[sel]:null;const courses=sel?build(sel):{};const tc=m?m.ch:0;const cp=m?m.cp:[];
  const tog=(c)=>{if(!courses[c])return;const d=done.has(c),r=cur.has(c);if(d)setDone(p=>{const n=new Set(p);n.delete(c);return n});else if(r){setCur(p=>{const n=new Set(p);n.delete(c);return n});setDone(p=>new Set(p).add(c))}else{if(courses[c].pre.every(p=>done.has(p)||p==="APPROVAL"||p.includes("CH")))setCur(p=>new Set(p).add(c))}};
  const avail=useMemo(()=>{const s=new Set();Object.entries(courses).forEach(([c,v])=>{if(done.has(c)||cur.has(c))return;if(v.pre.every(p=>done.has(p)||p==="APPROVAL"||p.includes("CH")))s.add(c)});return s},[done,cur,courses]);
  const dCH=useMemo(()=>{let t=0;done.forEach(c=>{if(courses[c])t+=courses[c].ch});return t},[done,courses]);
  const cCH=useMemo(()=>{let t=0;cur.forEach(c=>{if(courses[c])t+=courses[c].ch});return t},[cur,courses]);
  const rem=tc-dCH;
  const semLeft=(()=>{let r=rem,n=0;while(r>0){r-=Math.min(r,15);n++;if(r<=0)break;r-=Math.min(r,15);n++;if(r<=0)break;if(r>0){r-=Math.min(r,3);n++}}return n})();
  const grp=useMemo(()=>{const g={gen:[],"gen-elec":[],college:[],"college-cs":[],program:[],elective:[]};Object.entries(courses).forEach(([c,v])=>{if(filt==="program"&&v.cat!=="program"&&v.cat!=="elective")return;if(filt==="college-all"&&v.cat!=="college"&&v.cat!=="college-cs")return;if(filt==="gen"&&v.cat!=="gen"&&v.cat!=="gen-elec")return;if(!sge&&v.cat==="gen-elec")return;if(g[v.cat])g[v.cat].push(c)});return g},[courses,filt,sge]);

  if(!sel)return(
    <div style={{minHeight:"100vh",background:"#05060a",padding:"40px 20px"}}>

        <p style={{color:"#475569",fontSize:13,maxWidth:560,margin:"0 auto 24px",lineHeight:1.6}}>Select your major to view all courses, prerequisites, critical path, and track your progress. Enter your name below for PDF export.</p>
        <input placeholder="Your name" value={name} onChange={e=>setName(e.target.value)} style={{background:"#0a0c12",border:"1px solid #1e293b",borderRadius:8,padding:"10px 16px",color:"#e2e8f0",fontSize:14,fontFamily:"inherit",outline:"none",width:300,maxWidth:"90%",marginBottom:28}}/>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(260px,1fr))",gap:12,textAlign:"left"}}>

            <div key={k} onClick={()=>{setSel(k);setDone(new Set());setCur(new Set())}} style={{background:"#0a0c12",border:"1.5px solid #1e293b",borderRadius:10,padding:"16px 20px",cursor:"pointer",transition:"all .25s",position:"relative",overflow:"hidden"}}
              onMouseEnter={e=>{e.currentTarget.style.borderColor=v.color;e.currentTarget.style.transform="translateY(-2px)"}} onMouseLeave={e=>{e.currentTarget.style.borderColor="#1e293b";e.currentTarget.style.transform="none"}}>

              <div style={{fontSize:14,fontWeight:700,color:"#e2e8f0",marginBottom:4}}>{v.name}</div>
              <div className="mono" style={{fontSize:9,color:"#475569"}}>{v.ch} CH</div>
              <div className="mono" style={{fontSize:8,color:"#334155",marginTop:3}}>{v.cpd}</div>
            </div>
          ))}

        <div className="mono" style={{marginTop:32,fontSize:8,color:"#1e293b"}}>By Abdulrahman Alamry • Not an official university resource</div>
      </div>
    </div>
  );

  const lb=CL(m.abbr);
  return(

        {name&&<p style={{color:"#333",fontSize:13}}>Student: {name}</p>}
        <p style={{color:"#666",fontSize:10}}>Completed: {dCH}/{tc} CH • Remaining: {rem} CH • Est. {semLeft} semesters left • {new Date().toLocaleDateString()}</p>
      </div>

        <div style={{maxWidth:1200,margin:"0 auto"}}>
          <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:4}}>
            <button onClick={()=>setSel(null)} style={{background:"none",border:"1px solid #1e293b",borderRadius:5,padding:"3px 8px",color:"#64748b",cursor:"pointer",fontSize:10,fontFamily:"inherit"}}>← Majors</button>
            <div style={{width:7,height:7,borderRadius:"50%",background:m.color}}/>
            <span className="mono" style={{fontSize:10,color:"#475569"}}>{m.abbr}</span>
            <div style={{flex:1}}/>
            <select value={yr} onChange={e=>setYr(+e.target.value)} style={{background:"#0a0c12",border:"1px solid #1e293b",borderRadius:5,padding:"3px 6px",color:"#e2e8f0",fontSize:10,fontFamily:"inherit"}}><option value={1}>Year 1</option><option value={2}>Year 2</option><option value={3}>Year 3</option><option value={4}>Year 4</option><option value={5}>Year 5</option></select>
            <select value={sem} onChange={e=>setSem(e.target.value)} style={{background:"#0a0c12",border:"1px solid #1e293b",borderRadius:5,padding:"3px 6px",color:"#e2e8f0",fontSize:10,fontFamily:"inherit"}}><option value="fall">Fall</option><option value="spring">Spring</option><option value="summer">Summer</option></select>
            <button onClick={()=>window.print()} style={{background:m.color+"22",border:`1px solid ${m.color}44`,borderRadius:5,padding:"3px 10px",color:m.color,cursor:"pointer",fontSize:10,fontWeight:600,fontFamily:"inherit"}}>Print / PDF</button>
          </div>
          <h1 style={{fontSize:20,fontWeight:800,color:"#f8fafc"}}>{m.name}</h1>
          {name&&<p style={{color:m.color,fontSize:11,fontWeight:600}}>{name}</p>}
        </div>
      </div>
      <div style={{maxWidth:1200,margin:"8px auto 0",padding:"0 20px"}}>
        <div style={{display:"flex",gap:7,flexWrap:"wrap"}}>
          <div className="stat-box" style={{flex:"1 1 140px",background:"#0a0c12",border:"1px solid #1e293b",borderRadius:7,padding:"9px 12px"}}><div className="mono" style={{fontSize:8,color:"#475569",letterSpacing:1.5,textTransform:"uppercase",marginBottom:2}}>Progress</div><div><span style={{fontSize:20,fontWeight:900,color:"#22c55e"}}>{dCH}</span><span style={{color:"#475569",fontSize:10}}> / {tc}</span></div><div style={{height:2,background:"#1e293b",borderRadius:1,marginTop:4,overflow:"hidden"}}><div style={{height:"100%",width:`${(dCH/tc)*100}%`,background:m.color,transition:"width .4s"}}/></div></div>
          <div className="stat-box" style={{flex:"1 1 100px",background:"#0a0c12",border:"1px solid #1e293b",borderRadius:7,padding:"9px 12px"}}><div className="mono" style={{fontSize:8,color:"#475569",letterSpacing:1.5,textTransform:"uppercase",marginBottom:2}}>Taking</div><div><span style={{fontSize:20,fontWeight:900,color:"#3b82f6"}}>{cur.size}</span><span style={{color:"#475569",fontSize:10}}> ({cCH} CH)</span></div></div>
          <div className="stat-box" style={{flex:"1 1 120px",background:"#0a0c12",border:"1px solid #1e293b",borderRadius:7,padding:"9px 12px"}}><div className="mono" style={{fontSize:8,color:"#475569",letterSpacing:1.5,textTransform:"uppercase",marginBottom:2}}>Semesters Left</div><div><span style={{fontSize:20,fontWeight:900,color:"#f59e0b"}}>{semLeft}</span><span style={{color:"#475569",fontSize:10}}> ({rem} CH)</span></div><div className="mono" style={{fontSize:7,color:"#334155"}}>15 CH/reg + 3 CH/summer</div></div>
          <div className="stat-box" style={{flex:"1 1 240px",background:"#0a0c12",border:"1px solid #1e293b",borderRadius:7,padding:"9px 12px"}}><div className="mono" style={{fontSize:8,color:"#475569",letterSpacing:1.5,textTransform:"uppercase",marginBottom:2}}>Critical Path</div><div style={{display:"flex",gap:2,marginTop:2}}>{cp.map(c=><div key={c} style={{flex:1,height:4,borderRadius:2,background:done.has(c)?'#22c55e':cur.has(c)?'#3b82f6':'#1e293b'}} title={c}/>)}</div><div className="mono" style={{fontSize:7,color:"#475569",marginTop:2}}>{m.cpd}</div></div>
        </div>
      </div>
      <div className="no-print" style={{maxWidth:1200,margin:"6px auto 0",padding:"0 20px",display:"flex",gap:4,flexWrap:"wrap",alignItems:"center"}}>
        {[{k:"all",l:"All"},{k:"gen",l:"Gen Ed"},{k:"college-all",l:"College"},{k:"program",l:m.abbr}].map(f=><button key={f.k} onClick={()=>setFilt(f.k)} style={{padding:"2px 8px",borderRadius:4,fontSize:9,fontWeight:600,border:filt===f.k?`1px solid ${m.color}`:"1px solid #1e293b",background:filt===f.k?"#1e293b":"transparent",color:filt===f.k?"#e2e8f0":"#64748b",cursor:"pointer",fontFamily:"inherit"}}>{f.l}</button>)}
        <div style={{flex:1}}/>
        <button onClick={()=>setSge(!sge)} style={{padding:"2px 8px",borderRadius:4,fontSize:9,fontWeight:600,border:"1px solid #1e293b",background:sge?"#1e293b":"transparent",color:sge?"#e2e8f0":"#475569",cursor:"pointer",fontFamily:"inherit"}}>{sge?"Hide":"Show"} Gen Electives</button>
        <button onClick={()=>{setDone(new Set());setCur(new Set())}} style={{padding:"2px 8px",borderRadius:4,fontSize:9,fontWeight:600,border:"1px solid #1e293b",background:"transparent",color:"#ef4444",cursor:"pointer",fontFamily:"inherit"}}>Reset</button>
      </div>
      <div className="no-print" style={{maxWidth:1200,margin:"4px auto 0",padding:"0 20px",display:"flex",gap:10}}>
        {[{c:"#22c55e",l:"Done"},{c:"#3b82f6",l:"Taking"},{c:"#fbbf24",l:"Available"},{c:"#475569",l:"Locked"}].map(x=><div key={x.l} style={{display:"flex",alignItems:"center",gap:3}}><div style={{width:6,height:6,borderRadius:2,background:x.c}}/><span className="mono" style={{fontSize:7,color:"#64748b"}}>{x.l}</span></div>)}
      </div>
      <div style={{maxWidth:1200,margin:"10px auto 24px",padding:"0 20px"}}>
        {["gen","gen-elec","college","college-cs","program","elective"].map(cat=>{
          const codes=grp[cat];if(!codes||!codes.length)return null;const cc=CC[cat]||CC.gen;
          let sections=[{l:lb[cat],c:codes}];
          if(cat==="gen-elec"){const gs={};codes.forEach(c=>{const g=courses[c]?.g||"Other";if(!gs[g])gs[g]=[];gs[g].push(c)});sections=Object.entries(gs).map(([g,c])=>({l:g,c}));}
          return(<div key={cat} style={{marginBottom:10}}>
            {cat!=="gen-elec"&&<div style={{display:"flex",alignItems:"center",gap:6,marginBottom:4}}>
              <div className="mono cat-header" style={{fontSize:8,color:cc.t,letterSpacing:1.5,textTransform:"uppercase",background:"#0a0c12",padding:"2px 7px",borderRadius:3,border:`1px solid ${cc.b}22`,whiteSpace:"nowrap"}}>{lb[cat]}</div>
              {cat==="elective"&&<span className="mono" style={{fontSize:8,color:"#f59e0b"}}>{m.er}</span>}
              <div style={{flex:1,height:1,background:"#0f1015"}}/>
            </div>}
            {sections.map((s,i)=>(<div key={i} style={{marginBottom:cat==="gen-elec"?4:0}}>
              {cat==="gen-elec"&&<div className="mono" style={{fontSize:7,color:"#334155",marginBottom:2,marginLeft:2}}>{s.l}</div>}
              <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
                {s.c.sort().map(code=>{const v=courses[code];if(!v)return null;const id=done.has(code),ic=cur.has(code),ia=avail.has(code),icp=cp.includes(code),ih=hov===code;
                  let bc="#1e293b",bg="#08090d",op=0.38;if(id){bc="#22c55e";bg="#071007";op=1}else if(ic){bc="#3b82f6";bg="#070a12";op=1}else if(ia){bc="#fbbf24";bg="#100f07";op=1}if(icp&&!id)bc=ic?"#3b82f6":ia?"#f97316":"#ef4444";
                  return(<div key={code} className="course-card" onMouseEnter={()=>setHov(code)} onMouseLeave={()=>setHov(null)} onClick={()=>tog(code)}
                    style={{position:"relative",width:155,minHeight:50,background:bg,border:`1.5px solid ${bc}`,borderRadius:5,padding:"6px 8px",cursor:"pointer",opacity:op,transition:"all .15s",transform:ih?"translateY(-1px)":"none",boxShadow:ih?`0 3px 12px ${bc}18`:"none"}}>
                    <div style={{position:"absolute",top:0,left:0,right:0,height:1.5,background:cc.b,borderRadius:"5px 5px 0 0",opacity:.25}}/>
                    {(id||ic)&&<div style={{position:"absolute",top:4,right:4,width:5,height:5,borderRadius:"50%",background:id?"#22c55e":"#3b82f6"}}/>}
                    <div className="mono" style={{fontSize:9,fontWeight:700,color:cc.t,marginBottom:1}}>{code}<span style={{fontWeight:400,color:"#2a2f3a",marginLeft:3,fontSize:7}}>{v.ch}CH</span></div>
                    <div style={{fontSize:8.5,color:id?"#86efac":ic?"#93c5fd":"#8892a4",fontWeight:600,lineHeight:1.2}}>{v.name}</div>
                    {ih&&<div className="mono" style={{fontSize:6.5,color:"#475569",lineHeight:1.4,marginTop:2,borderTop:"1px solid #151820",paddingTop:2}}>
                      {v.pre.length>0&&!v.pre.every(p=>p==="APPROVAL"||p.includes("CH"))&&<div>Pre: {v.pre.filter(p=>p!=="APPROVAL"&&!p.includes("CH")).join(", ")}</div>}
                      {v.pre.some(p=>p.includes("CH"))&&<div>Req: Pass {v.pre.find(p=>p.includes("CH"))}</div>}
                      {v.coreq&&<div style={{color:"#f59e0b"}}>Co-req: {v.coreq}</div>}
                    </div>}
                    {icp&&!id&&<div className="mono" style={{position:"absolute",bottom:2,right:3,fontSize:6,color:"#ef4444",fontWeight:700}}>CRITICAL</div>}
                  </div>);
                })}
              </div>
            </div>))}
          </div>);
        })}
      </div>
      <div className="no-print" style={{maxWidth:1200,margin:"0 auto",padding:"0 20px 10px"}}><div className="mono" style={{background:"#0a0c12",border:"1px solid #111318",borderRadius:5,padding:"8px 12px",fontSize:8,color:"#475569",lineHeight:1.7}}><b style={{color:"#94a3b8"}}>Usage:</b> Click <span style={{color:"#fbbf24"}}>yellow</span> → taking. Click <span style={{color:"#3b82f6"}}>blue</span> → done. Click <span style={{color:"#22c55e"}}>green</span> → undo. <b style={{color:"#f59e0b"}}>Co-req</b> = must take together. Use <b>Print / PDF</b> button to save your plan.</div></div>
      <div style={{borderTop:"1px solid #0f1015",padding:"10px 20px",textAlign:"center"}}><div className="mono" style={{fontSize:7,color:"#1e293b"}}>By Abdulrahman Alamry — SWE @ AASU • Official 2023-2024/2024-2025 Major Sheets • Not an official resource</div></div>
    </div>
  );
}
ReactDOM.render(<App/>,document.getElementById("root"));
</script>
</body>
</html>
